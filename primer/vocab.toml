# primer vocabulary: the single source of truth for token ids, arity and types.
# Ids are append-only: never renumber or reuse one. Add new tokens at the end.
# args: argument types in order (their count is the arity). ret: result type.
# vsa: what the fixed half of the embedding is (atom, ordered, computed, zero).
# count: a numbered range, e.g. R with count 64 is R0..R63 on consecutive ids.

