# primer vocabulary: the single source of truth for token ids, arity and types.
#
# Groups are listed in bootstrap order: each one can be explained using only
# the groups before it. Generators and the curriculum follow that order.
#
# Ids are append-only once a model has been trained on them or a dataset is
# kept: then never renumber or reuse one; a new token takes the next free id
# and goes in its group's section below. Until that first training run, ids
# are renumbered to stay in group order whenever tokens change.
#
# args: argument types in order (their count is the arity). ret: result type.
# vsa: what the fixed half of the embedding is (atom, ordered, computed, zero).
# form: for a token that heads a statement, what follows it (PATCH: "word
# ((AT expr)? edit)+ END"). This is the statement grammar; primer/forms.py
# says how to read it.
# part: what the form is part of, if not a statement ("edit": inside PATCH).
# binds: the token itself binds the word it is about, so no NEW follows it.
# Text writes the word as its payload (DEF<NEW3>); the id form drops it.
# en: the token in simple English, for the translator at the edge (see
# primer/english.py). {0} {1} ... are its arguments, or a form's captures in
# order; a compound one gets brackets unless written {0!}. {v} is the name a
# binder introduces. {0?} reads a test as a condition ("x where ...").
# {1|IS=is a|ISNOT=is not a} says which word a choice gives. [a|b] is a if every placeholder in it has a value, else b.
#
# [[name]] rows are families of names the text form uses for bound things
# (V0, NEW3, R12: any number). The model never sees the numbers: each name
# becomes a binder token where it is bound and a REF pointing back at that
# binder everywhere else (see primer/serialize.py).

[[name]]
prefix = "R"
group = "values"
binder = "SLOT"
note = "slot: an object the harness binds for the episode; R3<NUM 5> binds it with its value, a bare R3 uses it"

[[name]]
prefix = "V"
group = "compute"
binder = "LAM"
note = "variable, de Bruijn in text: V0 is the nearest enclosing LAM or LET, V1 the next one out"

[[name]]
prefix = "NEW"
group = "teach"
binder = "NEW"
note = "word whose meaning DEF or EX sets inside one sequence; its first appearance binds it (DEF<NEW3> binds NEW3 at the DEF)"

[[group]]
name = "syntax"
about = "sequence structure, lists, records and holes"

[[group]]
name = "logic"
about = "truth values, connectives, equality and IF"

[[group]]
