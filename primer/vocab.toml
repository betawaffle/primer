# primer vocabulary: the single source of truth for token ids, arity and types.
#
# Groups are listed in bootstrap order: each one can be explained using only
# the groups before it. Generators and the curriculum follow that order.
#
# Ids are append-only: never renumber or reuse one. A new token takes the next
# free id and goes in its group's section below, so ids added later won't be
# in file order. Ids were renumbered once, for v1 (2026-10-10, before any
# model or kept dataset existed), so that they start out in group order.
#
# args: argument types in order (their count is the arity). ret: result type.
# vsa: what the fixed half of the embedding is (atom, ordered, computed, zero).
# count: a numbered range, e.g. R with count 64 is R0..R63 on consecutive ids.

[[group]]
name = "syntax"
about = "sequence structure, lists, records and holes"

[[group]]
name = "logic"
about = "truth values, connectives, equality and IF"

[[group]]
name = "values"
about = "the value kinds, ordering, and slots"

[[group]]
name = "compute"
about = "functions, arithmetic, lists, records and vector algebra"

[[group]]
name = "teach"
about = "defining words and checking claims about them"

[[group]]
name = "quote"
about = "expressions as data, and their parts of speech"

[[group]]
name = "edit"
about = "changing a definition in place"

[[group]]
name = "episode"
about = "goals, actions with a budget, and their outcomes"

[[group]]
name = "think"
about = "thoughts before acting, withdrawing them, and what computing costs"

[[group]]
name = "belief"
about = "chances, bets and surprise"

[[group]]
name = "agenda"
about = "side ideas kept for later"

